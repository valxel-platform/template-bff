spring:
  application:
    name: template-bff
  # Sign-in with the product's Keycloak realm, as this BFF's confidential client.
  security:
    oauth2:
      client:
        registration:
          keycloak:
            provider: keycloak
            client-id: ${BFF_CLIENT_ID:template-bff}
            client-secret: ${BFF_CLIENT_SECRET:}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            # openid for sign-in; the product's API scopes so the relayed token can call it.
            scope: ${BFF_SCOPES:openid,profile}
        provider:
          keycloak:
            issuer-uri: ${BFF_ISSUER:}           # https://id.<domain>/realms/<product>
  cloud:
    gateway:
      server:
        webflux:
          # A slow or stuck service never ties up the edge: connect within 2 s, answer within 30 s.
          httpclient:
            connect-timeout: ${BFF_CONNECT_TIMEOUT_MS:2000}
            response-timeout: ${BFF_RESPONSE_TIMEOUT:30s}
          routes:
            # The product's mobile apps: the app's own bearer token (checked by MobileSecurityConfig)
            # passed on as it is, /mobile stripped, cookies removed.
            - id: mobile
              uri: ${API_URL:http://localhost:8080}
              predicates:
                - Path=/mobile/api/**
              filters:
                - StripPrefix=1
                - RemoveRequestHeader=Cookie
                # Per person (the token's subject), across every replica (Redis): 429 past it.
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: ${BFF_RATE_PER_SECOND:20}
                    redis-rate-limiter.burstCapacity: ${BFF_RATE_BURST:40}
            # The product's API: the person's access token relayed (and refreshed), the session
            # cookie removed. One route per service in a real product, e.g. Path=/api/v1/patients/**.
            - id: api
              uri: ${API_URL:http://localhost:8080}
              predicates:
                - Path=/api/**
              filters:
                - SaveSession
                - TokenRelay=
                - RemoveRequestHeader=Cookie
                - name: RequestRateLimiter
                  args:
                    redis-rate-limiter.replenishRate: ${BFF_RATE_PER_SECOND:20}
                    redis-rate-limiter.burstCapacity: ${BFF_RATE_BURST:40}
            # Everything else is the web app's pages, from the web component (same origin).
            - id: web
              uri: ${WEB_URL:http://localhost:8082}
              predicates:
                - Path=/**
              filters:
                - RemoveRequestHeader=Cookie
                - RemoveRequestHeader=Authorization
  session:
    timeout: ${BFF_SESSION_TIMEOUT:30m}
  data:
    redis:
      # rediss:// (TLS) with the password from a secret outside local work: DeployedRedis refuses
      # to start a deployed BFF on redis://.
      url: ${REDIS_URL:redis://localhost:6379}

server:
  port: ${PORT:8080}
  shutdown: graceful
  # TLS ends at the gateway: trust its X-Forwarded-* headers, so cookies are Secure, redirects use
  # https and HSTS is sent.
  forward-headers-strategy: framework
  reactive:
    session:
      cookie:
        name: __Host-SESSION     # __Host-: Secure, Path=/, no Domain: only this origin, only TLS
        http-only: true
        secure: true
        same-site: strict
        path: /

management:
  server:
    port: ${MANAGEMENT_PORT:8081}   # health and metrics: platform only, never an endpoint
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  tracing:
    sampling:
      probability: 1.0
  otlp:
    metrics:
      export:
        enabled: false

logging:
  structured:
    format:
      console: ecs                # JSON logs; never log cookies, codes or tokens

# Error reports (ErrorReports). Sentry starts only when SENTRY_DSN is set (no sentry.dsn here, so
# an unset DSN leaves Sentry off). Unhandled exceptions and ERROR logs become events.
sentry:
  environment: ${ENVIRONMENT:local}
  release: ${SENTRY_RELEASE:}
  send-default-pii: false
  max-request-body-size: none
  # Every report names its component, so the SDLC tool routes its issues to it.
  tags:
    component: ${spring.application.name}
  logging:
    minimum-event-level: error
    minimum-breadcrumb-level: error

app:
  bff:
    origins: ${BFF_ORIGINS:}      # e.g. https://emr.example.com; empty: the request's own origin
    after-login: /
    after-logout: "{baseUrl}/"
    mobile:
      audience: ${BFF_MOBILE_AUDIENCE:}         # the product's API, e.g. emr-api; empty: no mobile app
      min-version: ${BFF_MOBILE_MIN_VERSION:}   # oldest app version still supported, e.g. 1.4.0
  # Sign-ins, failed sign-ins and sign-outs on the product's audit trail (SignInAudit): kafka in
  # deployed environments, log locally. Sent without waiting; never blocks signing in.
  audit:
    sink: ${AUDIT_SINK:log}
    bootstrap: ${AUDIT_KAFKA_BOOTSTRAP:}
    topic: ${AUDIT_TOPIC:audit.v1}
    product: ${PRODUCT:}
    environment: ${ENVIRONMENT:}
    data-class: ${DATA_CLASS:general}    # phi and payments: security.protocol must be SSL or SASL_SSL
    # kafka: { security.protocol: SASL_SSL, sasl.mechanism: SCRAM-SHA-512, sasl.jaas.config: ... }
