version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }  # newly published versions wait a week (security updates do not)
    groups:
      spring-boot: { patterns: ["org.springframework.boot*"] }
      test: { patterns: ["org.testcontainers*", "org.junit*", "org.assertj*", "com.nimbusds*"] }
    open-pull-requests-limit: 0
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }  # newly published versions wait a week (security updates do not)
    open-pull-requests-limit: 0
  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly }
    cooldown: { default-days: 7 }  # newly published versions wait a week (security updates do not)
    # The JDK follows the Java toolchain (21, LTS): move both together, by hand, not by Dependabot.
    ignore:
      - dependency-name: eclipse-temurin
        update-types: [version-update:semver-major]
      - dependency-name: gcr.io/distroless/java21-debian13
        update-types: [version-update:semver-major]
    open-pull-requests-limit: 0
