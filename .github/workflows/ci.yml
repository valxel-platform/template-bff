# Required checks on the default branch: unit (and CodeQL, from default setup). The unit job also
# runs the integration tests, which start Redis in a container.
# Job names are the check names the Valxel SDLC and the branch ruleset look for; keep them.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  REPORT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  unit:
    name: unit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      statuses: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the base branch, for coverage of new code
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1 (also validates the wrapper)
      - run: ./gradlew test jacocoTestCoverageVerification
      # The audit events the tests built meet the shared valxel.audit.v1 schema (contracts/audit).
      - name: Audit events against the shared schema
        run: |
          python3 -m venv /tmp/schema && /tmp/schema/bin/pip install -q jsonschema==4.25.1
          /tmp/schema/bin/python .github/scripts/check_audit_events.py
      # The event and cohort lines the tests built meet the shared contracts (contracts/events).
      - name: Summary lines against the shared contracts
        run: /tmp/schema/bin/python .github/scripts/check_contract_lines.py
      - name: Report results
        if: ${{ !cancelled() }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/report.py --context "unit / report" --junit 'build/test-results/test/*.xml' --jacoco build/reports/jacoco/test/jacocoTestReport.xml
      # The lines this pull request changes that no test runs (diff-cover), posted as the
      # code-quality / new code status the quality gate reads. The status is the gate, not this job.
      - name: Coverage on new code
        if: github.event_name == 'pull_request' && !cancelled()
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          pipx run diff-cover==11.0.2 build/reports/jacoco/test/jacocoTestReport.xml --compare-branch="origin/$BASE_REF" \
            --format json:new-code.json
          python3 .github/scripts/report.py --context "code-quality / new code" --new-code new-code.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: test-reports
          path: build/reports/
          retention-days: 14

  # GitHub cannot read Gradle builds by itself: submit the resolved dependency graph so Dependabot
  # alerts and dependency review (the pipeline's "dependencies" suite) see every library.
  dependency-submission:
    name: dependency-submission
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/dependency-submission@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

  dependency-review:
    name: dependency-review
    if: github.event_name == 'pull_request'
    needs: dependency-submission
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure

  image:
    name: image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # OpenChoreo builds and ships the image; this proves it builds and has no known high or
      # critical vulnerabilities with a fix available. (Starting it needs the product's Keycloak.)
      - run: docker build --pull -t template-bff:ci .
      # Syft and Grype run as containers (pinned versions), not as marketplace actions.
      # The template contract on the built image, run as the platform runs it
      # (.github/scripts/conformance.py, conformance.yaml): an audit record that meets the shared
      # schema, spans at a collector, product events, flags through OFREP.
      - name: Conformance
        run: |
          docker rm -f smoke || true
          python3 -m venv /tmp/conformance
          /tmp/conformance/bin/pip install -q pyyaml==6.0.3 jsonschema==4.25.1 "pyjwt[crypto]==2.10.1"
          /tmp/conformance/bin/python .github/scripts/conformance.py image
      - name: Software bill of materials
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock anchore/syft:v1.57.1 \
            docker:template-bff:ci -o cyclonedx-json > sbom.cyclonedx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom.cyclonedx.json
          retention-days: 30
      - name: Scan for vulnerabilities with a fix
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock anchore/grype:v0.121.3 \
            docker:template-bff:ci --only-fixed --fail-on high
